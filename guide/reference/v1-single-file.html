<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faf9f5">
<title>Which AI Model Should You Use?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500;600&family=Urbanist:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<style>
/* Layout idea: one reading column, a sticky header with the three model families and five chapters, one chapter on screen at a time. Each family is its own visual world. */
:root{
  --bg:#faf9f5; --surface:#ffffff; --surface-2:#f0eee6; --ink:#141413; --ink-2:#5e5d59; --line:#e3e0d5;
  --accent:#d97757; --bar:#d97757;
  --display:'Lora',Georgia,'Times New Roman',serif;
  --body:'Poppins','Helvetica Neue',Arial,sans-serif;
  --h-weight:600; --h-track:-.015em;
  color-scheme:light;
}
body[data-world="openai"]{
  --bg:#000000; --surface:#0e0e11; --surface-2:#18181d; --ink:#f5f5f7; --ink-2:#a1a1aa; --line:#2a2a31;
  --accent:#ffffff; --bar:#ffffff;
  --display:'Urbanist','Helvetica Neue',Arial,sans-serif; --body:'Urbanist','Helvetica Neue',Arial,sans-serif;
  --h-weight:700; --h-track:-.03em;
  color-scheme:dark;
}
body[data-world="gemini"]{
  --bg:#f8fafd; --surface:#ffffff; --surface-2:#edf2fb; --ink:#1f1f1f; --ink-2:#5f6368; --line:#dce3ee;
  --accent:#1a73e8; --bar:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);
  --display:'Google Sans Flex','Outfit','Helvetica Neue',Arial,sans-serif; --body:'Google Sans Flex','Outfit','Helvetica Neue',Arial,sans-serif;
  --h-weight:500; --h-track:-.02em;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;transition:background-color .5s ease,color .5s ease}
body[data-world="openai"]{background-image:
  radial-gradient(1.3px 1.3px at 12% 18%,rgba(255,255,255,.7),transparent 70%),
  radial-gradient(1px 1px at 72% 9%,rgba(255,255,255,.5),transparent 70%),
  radial-gradient(1px 1px at 38% 62%,rgba(255,255,255,.35),transparent 70%),
  radial-gradient(1.4px 1.4px at 88% 44%,rgba(255,255,255,.6),transparent 70%),
  radial-gradient(1px 1px at 22% 86%,rgba(255,255,255,.4),transparent 70%),
  radial-gradient(1px 1px at 58% 30%,rgba(255,255,255,.3),transparent 70%);
  background-size:420px 420px;background-attachment:fixed}
body[data-world="gemini"]{background-image:
  radial-gradient(800px 340px at 92% -140px,rgba(155,114,203,.17),transparent 70%),
  radial-gradient(800px 340px at 0% -160px,rgba(66,133,244,.17),transparent 70%);
  background-repeat:no-repeat}
a{color:inherit}
button,select{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}
.skip:focus{left:12px}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background-color .5s}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px 0}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.mark{display:inline-flex;gap:3px}
.mark i{width:9px;height:9px;border-radius:50%;display:block}
.mark i:nth-child(1){background:#d97757}
.mark i:nth-child(2){background:#141413;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #141413}
.mark i:nth-child(3){background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570)}
.field-pick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;min-width:0}
.field-pick select{font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:46vw}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin:10px 0 4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.worlds button{border:0;border-radius:999px;padding:9px 6px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;transition:background-color .3s,color .3s}
.worlds button svg{width:16px;height:16px;flex:none}
.worlds button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chapters{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 10px}
.chapters::-webkit-scrollbar{display:none}
.chapters button{flex:0 0 auto;border:0;background:none;color:var(--ink-2);padding:10px 9px 13px;position:relative;cursor:pointer;white-space:nowrap;font-size:14.5px}
.chapters .n{font-variant-numeric:tabular-nums;opacity:.55;margin-right:6px;font-size:13px}
.chapters button[aria-current="step"]{color:var(--ink);font-weight:600}
.chapters button[aria-current="step"]::after{content:"";position:absolute;left:9px;right:9px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--bar)}

/* Page */
main{max-width:780px;margin:0 auto;padding:0 16px;outline:none}
.ch{padding:26px 0 0;animation:chIn .5s cubic-bezier(.2,.75,.2,1)}
main[data-dir="back"] .ch{animation-name:chBack}
h1,h2,h3,.disp{font-family:var(--display);font-weight:var(--h-weight);letter-spacing:var(--h-track);text-wrap:balance}
h1{font-size:clamp(33px,8.8vw,52px);line-height:1.04;margin:0 0 12px}
h2{font-size:clamp(28px,7vw,40px);line-height:1.08;margin:0 0 10px}
h3{font-size:21px;line-height:1.25;margin:34px 0 12px}
h4{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink-2);margin:16px 0 4px;letter-spacing:0}
p{margin:0 0 12px}
.lede{font-size:17px;color:var(--ink-2);max-width:58ch;margin:0 0 18px}
.fine{font-size:13.5px;color:var(--ink-2);max-width:62ch}

.dials{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 10px}
.dial{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px;border-radius:16px;background:var(--surface-2);font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.dial svg{width:28px;height:28px;color:var(--ink)}
.dial b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* Ladder */
.ladder{list-style:none;margin:24px 0 0;padding:0 0 0 30px;position:relative;display:grid;gap:6px}
.stop::after{content:"";position:absolute;left:-21.5px;top:57px;height:calc(100% + 6px);width:4px;border-radius:4px;background:linear-gradient(to top,var(--c2,var(--c)),var(--c));transform-origin:50% 100%;animation:climb .5s cubic-bezier(.6,0,.3,1) both;animation-delay:calc((var(--i) - 1) * 140ms + 120ms)}
.stop:last-child::after{display:none}
.stop{position:relative;display:grid;grid-template-columns:86px 1fr;gap:14px;padding:14px 12px 14px 6px;border-radius:20px;transition:background-color .4s}
.stop::before{content:"";position:absolute;z-index:1;left:-27px;top:49.5px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:4px solid var(--c);animation:pop .45s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i) * 140ms + 250ms)}
.stop.is-start{background:color-mix(in srgb,var(--c) 11%,transparent)}
.stop.is-off .stop-ill{filter:grayscale(.55);opacity:.8}
.stop-ill{width:86px;height:86px;animation:pop .6s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i) * 140ms)}
.stop-ill svg,.mini svg{width:100%;height:100%;display:block;overflow:visible}
.stop-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.stop h3{margin:0;font-size:23px}
.tag{margin:5px 0 8px;font-size:15px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2);margin:0 0 4px}
.price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--body);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap;letter-spacing:0}
.badge svg{width:12px;height:12px}
.badge.soft{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.badge.dash{background:transparent;color:var(--ink-2);border:1px dashed var(--ink-2)}
.more{border:0;background:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 0;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.more svg{width:14px;height:14px;transition:transform .35s cubic-bezier(.3,.8,.2,1)}
.stop.open .more svg{transform:rotate(180deg)}
.detail{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .45s cubic-bezier(.2,.75,.2,1),visibility .45s}
.stop.open .detail{grid-template-rows:1fr;visibility:visible}
.detail-in{overflow:hidden;min-height:0;font-size:15px}
.detail-in > :first-child{margin-top:6px}
.detail ul{margin:0;padding-left:18px}
.detail li{margin:2px 0}
.where{font-size:13px;color:var(--ink-2);margin:12px 0 4px}
.field-ex{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--c,var(--accent));background:var(--surface-2);border-radius:0 14px 14px 0}
.field-ex h4{margin:0 0 3px}
.field-ex p{margin:0}
.naming{font-size:14px;color:var(--ink-2);margin:18px 0 0;padding-left:30px;max-width:60ch}

/* Effort */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .25s,box-shadow .25s}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.scene{border-radius:22px;background:var(--surface-2);overflow:hidden;aspect-ratio:16/9;max-height:320px;width:100%;border:1px solid var(--line)}
body[data-world="openai"] .scene{background:radial-gradient(circle at 50% 50%,#121218,#050507)}
.scene svg{width:100%;height:100%;display:block}
.levels{position:relative;display:flex;gap:2px;padding:4px;margin:14px 0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.levels button{position:relative;z-index:1;flex:1 0 auto;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:color .3s}
.levels button[aria-checked="true"]{color:var(--bg)}
.levels button:disabled{opacity:.32;cursor:not-allowed}
.lv-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:0;border-radius:999px;background:var(--ink);transition:left .4s cubic-bezier(.3,.85,.2,1),width .4s cubic-bezier(.3,.85,.2,1)}
.readout{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.ro-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ro-name{font-family:var(--display);font-weight:var(--h-weight);font-size:26px;letter-spacing:var(--h-track);line-height:1.1}
.ro-api{font-size:13px;color:var(--ink-2)}
.readout > p{margin:0}
.meter{height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden;margin:16px 0 6px}
.meter i{display:block;height:100%;border-radius:10px;background:var(--c);transition:width .55s cubic-bezier(.3,.85,.2,1)}
.meter i.stripe{background:repeating-linear-gradient(45deg,var(--c) 0 8px,color-mix(in srgb,var(--c) 45%,transparent) 8px 16px)}
.meter-lab{font-size:13px;color:var(--ink-2);margin:0}
.after{font-size:14px;color:var(--ink-2);margin:14px 0 0;max-width:62ch}

/* Examples */
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:4px 0 6px}
.seg button{border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ex-list{list-style:none;padding:0;margin:8px 0 0}
.ex{display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.mini{width:54px;height:54px}
.ex b{display:block;font-size:15px;line-height:1.3}
.ex .who{font-size:12.5px;color:var(--ink-2);font-weight:400}
.ex p{margin:3px 0 0;font-size:15px}
.ex.off{opacity:.65}
.lv{width:54px;display:grid;justify-items:start;gap:5px;padding-top:2px}
.lv span{font-size:12.5px;font-weight:600;line-height:1.1}
.bars5{display:flex;gap:2px;align-items:flex-end;height:16px}
.bars5 i{width:6px;border-radius:2px;background:var(--line)}
.bars5 i.on{background:var(--ink)}
.caution{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);margin:18px 0 0;max-width:64ch}

/* Upgrade */
.steps{list-style:none;counter-reset:s;padding:0;margin:6px 0 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:14px;padding:11px 0;position:relative}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--ink);color:var(--bg);font-variant-numeric:tabular-nums}
.steps li:not(:last-child)::after{content:"";position:absolute;left:15px;top:46px;bottom:-4px;width:2px;background:var(--line)}
.steps b{display:block;font-size:16px;line-height:1.35;padding-top:4px}
.steps p{margin:3px 0 0;color:var(--ink-2);font-size:14.5px}
.sym{border-top:1px solid var(--line)}
.sym-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.fix{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
.fix svg{width:14px;height:14px}
.fix.strong{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp-col{padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start;min-width:0}
.cmp-col .tagab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.cmp-col select{width:100%;font-size:14px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.cmp-cost{font-family:var(--display);font-weight:var(--h-weight);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.cmp-sub{font-size:12.5px;color:var(--ink-2);margin:0}
.track2{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.track2 i{display:block;height:100%;border-radius:8px;background:var(--c);transition:width .5s cubic-bezier(.3,.85,.2,1)}
.verdict{margin:12px 0 0;padding:14px 16px;border-radius:18px;background:var(--surface-2);font-size:15px}
.verdict p{margin:0 0 6px}
.verdict p:last-child{margin:0}

/* Cost */
.tbl{overflow-x:auto;margin:6px 0 0}
table{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th.num,td.num{text-align:right;white-space:nowrap}
td .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
td .nm{display:inline-flex;align-items:center;gap:8px;font-weight:600}
td .nm .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.estim{margin-top:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin:2px 0 6px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.bars{display:grid;gap:12px;margin:12px 0 0}
.bar-row{display:grid;grid-template-columns:minmax(92px,128px) 1fr 84px;gap:10px;align-items:center;font-size:14px}
.bar-row .nm{font-weight:600;line-height:1.2}
.bar{height:12px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;min-width:3px;border-radius:12px;background:var(--c);transition:width .55s cubic-bezier(.3,.85,.2,1)}
.bar-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.2}
.bar-val small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.plan{margin:22px 0 0;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.plan h4{margin:0 0 4px;font-size:15px;color:var(--ink)}
.plan p{margin:0;font-size:14.5px;color:var(--ink-2)}

/* Pager + footer */
.pager{display:flex;justify-content:space-between;gap:12px;margin:38px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{font-weight:600;font-size:15px;border-radius:999px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.pager button svg{width:16px;height:16px}
.pager .next{background:var(--ink);color:var(--bg);border-color:var(--ink);margin-left:auto}
.foot{max-width:780px;margin:0 auto;padding:10px 16px 48px;font-size:13px;color:var(--ink-2)}
.foot p{max-width:68ch}
.foot summary{cursor:pointer;font-weight:600;color:var(--ink);padding:6px 0}
.foot ul{padding-left:18px;margin:6px 0}
.foot li{margin:4px 0}

/* Illustration motion */
.svgt{font-family:var(--body)}
.a-speed line{stroke-dasharray:9 7;animation:dash .7s linear infinite}
.a-glide{animation:bob 2.6s ease-in-out infinite}
.a-wing{transform-box:fill-box;transform-origin:15% 100%;animation:flap .42s ease-in-out infinite alternate}
.a-write{stroke-dasharray:1;stroke-dashoffset:1;animation:write 3.4s ease-in-out infinite}
.a-quill{animation:quill 3.4s ease-in-out infinite}
.a-rip{transform-box:fill-box;transform-origin:50% 50%;vector-effect:non-scaling-stroke;animation:ripple 3.3s ease-out infinite}
.a-rip.d2{animation-delay:-1.1s}.a-rip.d3{animation-delay:-2.2s}
.a-frog{animation:hop 4.2s ease-in-out infinite}
.a-float{animation:float 4s ease-in-out infinite}
.a-wl{transform-box:fill-box;transform-origin:100% 50%;animation:wing .3s ease-in-out infinite alternate}
.a-wr{transform-box:fill-box;transform-origin:0% 50%;animation:wing .3s ease-in-out infinite alternate}
.a-tw{animation:tw 2.4s ease-in-out infinite}.a-tw.d2{animation-delay:-.8s}.a-tw.d3{animation-delay:-1.6s}
.a-phase{animation:phase 7s ease-in-out infinite alternate}
.a-earth{animation:earth 16s linear infinite}
.a-cloud{animation:earth 26s linear infinite}
.a-rot,.s-rot{transform-box:view-box;animation:rot 30s linear infinite}
.a-pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 3.2s ease-in-out infinite}
.a-flick{animation:flick 2.8s steps(1,end) infinite}
.a-glow{animation:glow 2.8s ease-in-out infinite}
.s-rip{transform-box:fill-box;transform-origin:50% 50%;vector-effect:non-scaling-stroke;animation:srip linear infinite}
.s-dot{animation:tw 1.6s ease-in-out infinite}

@keyframes chIn{from{transform:translateX(26px);opacity:.25}to{transform:none;opacity:1}}
@keyframes chBack{from{transform:translateX(-26px);opacity:.25}to{transform:none;opacity:1}}
@keyframes climb{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{from{transform:scale(.55)}to{transform:scale(1)}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes flap{to{transform:scaleY(.18)}}

/* Scroll stories */
body{overflow-x:hidden}
.scrollcue{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin:10px 0 0}
.scrollcue svg{width:16px;height:16px;animation:bob 1.8s ease-in-out infinite}
.journey{position:relative;width:100vw;left:50%;margin-left:-50vw;margin-top:20px;height:calc(var(--n) * 95vh + 25vh);height:calc(var(--n) * 95svh + 25svh)}
.stage{position:sticky;top:var(--hdr,128px);height:calc(100vh - var(--hdr,128px));height:calc(100svh - var(--hdr,128px));overflow:hidden;isolation:isolate}
.stage[data-w="claude"]{background:#efe5cf}
.stage[data-w="openai"]{background:#000}
.stage[data-w="gemini"]{background:linear-gradient(160deg,#071331 0%,#0c1f5c 55%,#1a1146 100%)}
.stage-art{position:absolute;inset:0;z-index:1}
.stage-art svg,.stage-art canvas{display:block;width:100%;height:100%}
.aurora{position:absolute;inset:-25%;z-index:0;background:radial-gradient(38% 28% at 25% 30%,rgba(66,133,244,.5),transparent 70%),radial-gradient(34% 26% at 76% 24%,rgba(155,114,203,.45),transparent 70%),radial-gradient(40% 30% at 62% 82%,rgba(217,101,112,.35),transparent 70%);filter:blur(28px);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}
.grain{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:.6;background-size:220px 220px}
.grain::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(92,66,32,.3) 100%)}
.cap{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 24px))}
.cap-in{display:flex;gap:12px;align-items:flex-start;padding:14px 16px 12px;border-radius:20px;animation:capIn .45s cubic-bezier(.2,.75,.2,1)}
.cap-txt{min-width:0;flex:1}
@keyframes capIn{from{transform:translateY(14px);opacity:.15}to{transform:none;opacity:1}}
.stage[data-w="claude"] .cap-in{background:rgba(248,242,228,.95);border:1px solid #2b2620;color:#2b2620;box-shadow:0 14px 30px -18px rgba(43,38,32,.55)}
.stage[data-w="claude"] .cap .badge{background:#d97757;color:#fff}
.stage[data-w="claude"].night .cap-in{background:rgba(24,28,42,.93);border-color:#c9a24a;color:#f4ead2}
.stage[data-w="claude"].night .cap .badge{background:#c9a24a;color:#1b1f2e}
.stage[data-w="openai"] .cap-in{background:rgba(10,10,14,.6);border:1px solid rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.stage[data-w="openai"] .cap .badge{background:#fff;color:#000}
.stage[data-w="gemini"] .cap-in{background:rgba(255,255,255,.96);color:#1f1f1f;box-shadow:0 18px 40px -20px rgba(0,0,0,.6)}
.stage[data-w="gemini"] .cap .badge{background:#1f1f1f;color:#fff}
.cap .badge.soft,.cap .badge.dash{background:transparent!important;color:inherit!important;border-color:currentColor;opacity:.85}
.cap-step{display:flex;gap:12px;font-size:12.5px;opacity:.72;margin:0 0 2px}
.cap-name{margin:0;font-size:25px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;line-height:1.12}
.cap-tag{margin:5px 0 6px;font-size:14.5px;line-height:1.42}
.cap-meta{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;opacity:.85;margin:0 0 4px}
.cap-meta b{font-variant-numeric:tabular-nums}
.cap-more{border:0;background:none;color:inherit;font-weight:600;font-size:14px;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.etile{flex:none;width:52px;height:58px;border-radius:10px;border:2px solid var(--c);display:grid;grid-template-rows:auto 1fr;padding:4px 6px;background:#fff;color:#1f1f1f}
.etile b{font-size:11px;font-weight:600;color:#5f6368;line-height:1}

.etile svg{width:24px;height:30px;justify-self:center}
.rail{position:absolute;z-index:4;right:12px;top:38%;transform:translateY(-50%);display:grid;gap:14px;--rc:#2b2620}

.rail button::before{content:"";position:absolute;inset:-9px}
.rail button[aria-current="true"]{background:var(--rc);transform:scale(1.35)}
.glance-h{margin:38px 0 2px;font-size:clamp(24px,6vw,32px)}
.ladder.compact{margin-top:14px}
.ladder.compact .stop{grid-template-columns:1fr;padding:12px 12px 12px 6px}
.ladder.compact .stop::before{top:20px}
.ladder.compact .stop::after{top:27px}
.sheet{position:fixed;inset:0;z-index:60;display:grid;align-items:end;justify-items:center}

.sheet-card{position:relative;width:min(640px,100%);max-height:86vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 20px 30px;border:1px solid var(--line);animation:sheetUp .38s cubic-bezier(.2,.8,.2,1)}

.sheet-card .detail-in{font-size:15px}
.sheet-x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}}
[class*="w-flap"]{transform-box:fill-box;transform-origin:8% 96%;animation:sflap .34s ease-in-out infinite alternate}
[class*="w-flap"].far{transform-origin:92% 96%}

@keyframes sflap{to{transform:scaleY(-.5)}}
.c-away{animation:away 9s linear infinite}
@keyframes away{from{transform:translate(330px,330px)}to{transform:translate(700px,170px)}}

@keyframes flame{to{transform:scale(.9,1.12) skewX(4deg)}}
.c-rip{transform-box:fill-box;transform-origin:50% 50%;vector-effect:non-scaling-stroke;animation:ripple 3.6s ease-out infinite}
.c-rip.d2{animation-delay:-1.2s}.c-rip.d3{animation-delay:-2.4s}
.c-reed,.c-blade{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
.c-blade{animation-duration:3.2s}
@keyframes sway{from{transform:rotate(-1.8deg)}to{transform:rotate(1.8deg)}}
.c-dfly{animation:dfly 6s ease-in-out infinite}
@keyframes dfly{0%,100%{transform:translate(0,0)}30%{transform:translate(-34px,-16px)}60%{transform:translate(12px,8px)}}
.c-dwing{transform-box:fill-box;transform-origin:50% 100%;animation:dw .07s linear infinite alternate}
@keyframes dw{to{transform:scaleY(.55)}}
.c-bfi .bw-l{transform-box:fill-box;transform-origin:100% 50%;animation:bwing .24s ease-in-out infinite alternate}
.c-bfi .bw-r{transform-box:fill-box;transform-origin:0% 50%;animation:bwing .24s ease-in-out infinite alternate}
.c-bfi.hero .bw-l,.c-bfi.hero .bw-r{animation-duration:.5s}
.c-bfi.f1 .bw-l,.c-bfi.f1 .bw-r{animation-delay:-.1s}.c-bfi.f2 .bw-l,.c-bfi.f2 .bw-r{animation-delay:-.17s}
@keyframes bwing{to{transform:scaleX(.14)}}
.c-star{animation:tw 3s ease-in-out infinite}

<script>
/* Scroll-story engines. Each engine: mount(el), frame(u, t), destroy(). u runs 0..n-1 (lightest model first). */
(function(){
"use strict";
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }
function seg(u,a,b){ return clamp((u-a)/(b-a),0,1); }
function ease(x){ return x*x*(3-2*x); }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function f1(n){ return n.toFixed(1); }

/* ================= CLAUDE: 2D naturalist plates ================= */
var INK='#2b2620', PAPER='#efe5cf';
function hLines(x0,x1,y0,y1,step){ var d=''; for(var y=y0;y<=y1;y+=step){ d+='M'+f1(x0)+','+f1(y)+'H'+f1(x1); } return d; }
function dLines(x0,y0,x1,y1,step){ var d=''; for(var k=-(y1-y0);k<(x1-x0);k+=step){ d+='M'+f1(x0+k)+','+f1(y1)+'L'+f1(x0+k+(y1-y0))+','+f1(y0); } return d; }
function cloudPath(x0,cy,w,h){
  var pts=[[x0,cy],[x0+w*.18,cy-h*.34],[x0+w*.44,cy-h*.62],[x0+w*.72,cy-h*.4],[x0+w,cy]], d='M'+x0+','+cy;
  for(var i=1;i<pts.length;i++){ var a=pts[i-1],b=pts[i],r=Math.hypot(b[0]-a[0],b[1]-a[1])*0.62; d+=' A'+f1(r)+','+f1(r)+' 0 0 1 '+f1(b[0])+','+f1(b[1]); }
  return d+' Z';
}
var cid=0;
function cloud(x0,cy,w,h){
  var id='cc'+(++cid), d=cloudPath(x0,cy,w,h);
  return '<clipPath id="'+id+'"><path d="'+d+'"/></clipPath><path d="'+d+'" fill="#f8f2e4" stroke="'+INK+'" stroke-width="1.6"/>'
    +'<path clip-path="url(#'+id+')" d="'+hLines(x0,x0+w,cy-h*.22,cy,4.5)+'" stroke="'+INK+'" stroke-width=".9" opacity=".32"/>';
}

   +'<g class="'+wc+' far"><path d="M30,-16 C14,-80 -34,-150 -108,-196 C-58,-132 -18,-80 2,-12 Z" fill="#1d2430" stroke="'+INK+'" stroke-width="1.4"/></g>'

   +'<path d="M-70,0 C-40,-26 40,-36 92,-24 C112,-19 126,-12 136,-6 C126,4 112,14 92,18 C40,30 -30,26 -70,10 Z" fill="#2c3644" stroke="'+INK+'" stroke-width="1.6"/>'
   +'<path d="M-40,9 C0,25 60,26 98,13 C82,26 30,33 -20,26 Z" fill="#f3e8d3"/>'
   +'<path d="M102,-13 C114,-7 122,-1 127,4 C118,13 104,15 95,12 C97,4 99,-4 102,-13Z" fill="#b5653f"/>'
   +'<path d="M-30,-2 C10,-14 50,-18 90,-14" stroke="#8c99a8" stroke-width="1" fill="none" opacity=".6"/>'
   +'<path d="M136,-6 L151,-2 L136,1 Z" fill="'+INK+'"/><circle cx="118" cy="-9" r="3.6" fill="#0e0f12"/><circle cx="119.2" cy="-10.2" r="1.1" fill="#fff"/>'
   +'<g class="'+wc+'"><path d="M40,-8 C70,-74 122,-142 206,-180 C156,-112 114,-50 72,4 Z" fill="#334055" stroke="'+INK+'" stroke-width="1.6"/>'
   +'<path d="M66,-24 L176,-160 M74,-14 L186,-138 M84,-6 L192,-112 M94,2 L180,-80" stroke="#9fb0c2" stroke-width="1" opacity=".55"/></g>'

function cursive(x0,x1,y,r){
  var d='M'+f1(x0)+','+f1(y), x=x0;
  while(x<x1-8){
    if(r()<0.13 && x>x0+30){ x+=12+r()*8; d+=' M'+f1(x)+','+f1(y); continue; }
    var w=6+r()*7, h=r()<0.18?20+r()*9:7+r()*9, xe=Math.min(x+w,x1);
    d+=' C'+f1(x+w*.1)+','+f1(y-h)+' '+f1(x+w*.95)+','+f1(y-h)+' '+f1(x+w*.55)+','+f1(y-2)+' S'+f1(xe+1)+','+f1(y+2)+' '+f1(xe)+','+f1(y);
    x=xe;
  }
  return d;
}
function stone(x,y,rx,ry,rot,fill,r){
  var s='<g transform="translate('+f1(x)+' '+f1(y)+') rotate('+f1(rot)+')"><ellipse rx="'+rx+'" ry="'+ry+'" fill="'+fill+'" stroke="'+INK+'" stroke-width="1.3"/>'
    +'<ellipse cx="'+f1(-rx*.25)+'" cy="'+f1(-ry*.35)+'" rx="'+f1(rx*.45)+'" ry="'+f1(ry*.28)+'" fill="#fff" opacity=".22"/>';

function lilyPad(x,y,rx,ry,rot){

  var p='';

function frog(){

function butterfly(cls, c1, c2, c3, big){

/* ---------- scroll story controller ---------- */
var JR = {eng:null, raf:0, idx:-1, n:0, models:null, t0:0, hdr:128};
function setHdr(){ var t = document.querySelector('.top'); if(t){ JR.hdr = t.offsetHeight; document.body.style.setProperty('--hdr', JR.hdr + 'px'); } }
function journeyU(){
  var j = document.getElementById('journey'), st = document.getElementById('stage'); if(!j || !st) return 0;
  var r = j.getBoundingClientRect(), span = r.height - st.offsetHeight; if(span <= 0) return 0;
  return Math.max(0, Math.min(1, (JR.hdr - r.top)/span)) * (JR.n - 1);
}
function capHTML(m, i){
  var tile = '';
  if(S.world==='gemini'){
    tile = m.el ? '<span class="etile" style="--c:' + m.color + '" aria-hidden="true"><b>' + m.el.num + '</b><i>' + m.el.sym + '</i></span>'
      : '<span class="etile" style="--c:' + m.color + '" aria-hidden="true"><b>3.8</b><svg viewBox="0 0 24 30"><path d="M14 1 L3 17 H11 L8 29 L21 11 H13 Z" fill="' + m.color + '" stroke="#e8a200"/></svg></span>';
  }
  return '<div class="cap-in">' + tile + '<div class="cap-txt"><p class="cap-step"><span>' + (i+1) + ' of ' + JR.n + '</span><span>' + (m.status==='available' ? ROLE[m.role] : (m.status==='testing' ? 'Not released' : 'Not public')) + '</span></p>'
    + '<h3 class="cap-name">' + esc(m.name) + badges(m) + '</h3>'
    + '<p class="cap-tag">' + esc(m.tagline) + '</p>'
    + '<p class="cap-meta"><span><b>' + priceText(m) + '</b>' + (m.price?' per 1M tokens':'') + '</span>' + (m.efforts.length ? '<span>' + effRange(m) + '</span>' : '') + '</p>'
    + '<button type="button" class="cap-more" data-act="sheet" data-id="' + m.id + '">What it is for</button></div></div>';
}
function updateCap(u){
  var i = Math.max(0, Math.min(JR.n-1, Math.round(u)));
  var st = document.getElementById('stage');
  if(st && S.world==='claude') st.classList.toggle('night', u > 3.55);
  if(i === JR.idx) return;
  JR.idx = i;
  var cap = document.getElementById('cap'); if(cap) cap.innerHTML = capHTML(JR.models[i], i);
  Array.prototype.forEach.call(document.querySelectorAll('#rail button'), function(b, k){ b.setAttribute('aria-current', k===i ? 'true' : 'false'); });
}
function stopJourney(){
  if(JR.raf) cancelAnimationFrame(JR.raf); JR.raf = 0;
  if(JR.eng){ try{ JR.eng.destroy(); }catch(e){} } JR.eng = null; JR.idx = -1;
}
function startJourney(){
  stopJourney();
  var art = document.getElementById('stageArt'); if(!art) return;
  setHdr();
  JR.models = world().models.slice().reverse(); JR.n = JR.models.length;
  var E = window.MG_ENGINES && window.MG_ENGINES[S.world];
  updateCap(journeyU());
  if(!E) return;
  JR.eng = new E();
  try{ JR.eng.mount(art); }catch(err){ console.error(err); JR.eng = null; return; }
  if(S.world==='claude' && E.grain){ var g = document.getElementById('grain'), url = E.grain(); if(g && url) g.style.backgroundImage = 'url(' + url + ')'; }
  JR.t0 = performance.now();
  var tick = function(now){
    if(!JR.eng) return;
    var u = journeyU();
    try{ JR.eng.frame(u, reduced ? 0 : (now - JR.t0)/1000); }catch(err){ console.error(err); }
    updateCap(u);
    JR.raf = requestAnimationFrame(tick);
  };
  JR.raf = requestAnimationFrame(tick);
}
function jumpTo(i){
  var j = document.getElementById('journey'), st = document.getElementById('stage'); if(!j || !st) return;
  var r = j.getBoundingClientRect(), span = r.height - st.offsetHeight;
  var top = window.scrollY + r.top - JR.hdr + span * (i/(JR.n-1)) + 2;
  window.scrollTo({top: top, behavior: reduced ? 'auto' : 'smooth'});
}
var lastFocus = null;
function openSheet(id){

function closeSheet(){ var sh = document.getElementById('sheet'); if(!sh || sh.hidden) return; sh.hidden = true; if(lastFocus && lastFocus.focus) lastFocus.focus(); }

function effState(){

function readout(m, lv){
  var w = world(), f = FIELDS[S.field], mu = mult(lv), maxm = MULT[S.world].max || MULT[S.world].high;
  var pct, lab;
  if(lv==='none'){ pct = 8; lab = 'Fastest and lightest. No extra reasoning.'; }
  else if(lv==='ultra'){ pct = 100; lab = 'Heaviest usage: several agents work at once.'; }
  else { pct = Math.round(mu/maxm*100); lab = (lv==='medium' ? 'The baseline: 1× the thinking cost of Medium.' : 'Roughly ' + mu.toFixed(1) + '× the cost of Medium on the same task.'); }
  var hint = lv==='ultra' ? ' on Astra' : (lv==='none' ? ' on Sol or Luna' : ' on ' + m.short);
  return '<div class="ro-head"><span class="ro-name">' + EFF[lv].label + '</span>' + (lv===m.start ? '<span class="badge">' + IC.pin + 'Start here</span>' : '') + '<span class="ro-api">' + esc(apiNote(lv)) + '</span></div>'
    + '<p>' + esc(EFF[lv].desc) + '</p>'
    + '<div class="meter" style="--c:' + m.color + '"><i class="' + (lv==='ultra'?'stripe':'') + '" style="width:' + pct + '%"></i></div>'
    + '<p class="meter-lab">' + lab + '</p>'
    + '<div class="field-ex" style="--c:' + m.color + '"><h4>In ' + esc(f.label) + hint + '</h4><p>' + esc(f.eff[lv]) + '</p></div>';

function cmpState(){

function priceEfforts(m){ return m.efforts.filter(function(k){ return k!=='none' && k!=='ultra'; }); }
function cmpCol(key, side){
  var u = usable(), sel = side.m, m = model(sel), effs = priceEfforts(m);
  if(effs.indexOf(side.e)<0) side.e = effs.indexOf('medium')>=0 ? 'medium' : effs[0];
  var mo = u.map(function(x){ return '<option value="' + x.id + '"' + (x.id===sel?' selected':'') + '>' + esc(x.name) + '</option>'; }).join('');
  var eo = effs.map(function(k){ return '<option value="' + k + '"' + (k===side.e?' selected':'') + '>' + EFF[k].label + '</option>'; }).join('');
  return '<div class="cmp-col" style="--c:' + m.color + '"><span class="tagab">Option ' + key.toUpperCase() + '</span>'
    + '<label class="sr" for="cm-' + key + '">Model for option ' + key.toUpperCase() + '</label><select id="cm-' + key + '" data-cmp="' + key + '" data-k="m">' + mo + '</select>'
    + '<label class="sr" for="ce-' + key + '">Effort for option ' + key.toUpperCase() + '</label><select id="ce-' + key + '" data-cmp="' + key + '" data-k="e">' + eo + '</select>'
    + '<div class="cmp-cost" id="cc-' + key + '"></div><p class="cmp-sub">per paper summary</p><div class="track2"><i id="cb-' + key + '" style="width:0"></i></div></div>';
}
function verdict(A, B){
  var ra = RANK[A.m.role], rb = RANK[B.m.role], r = A.cost/B.cost, cl, adv;
  if(r > 0.85 && r < 1.18) cl = 'They cost about the same per task.';
  else if(r >= 1.18) cl = 'A costs about ' + r.toFixed(1) + '× as much as B.';
  else cl = 'B costs about ' + (1/r).toFixed(1) + '× as much as A.';
  if(A.m.id===B.m.id){ adv = 'Same model, different thinking time. Raise effort only when answers skip steps or slip on details.'; }
  else if(ra===rb){ adv = 'Both sit in the same tier, so pick the newer or cheaper one and tune its effort.'; }
  else {
    var big = ra>rb ? A : B, small = big===A ? B : A;
    if(lvIndex(big.e) < lvIndex(small.e)){
      adv = big.m.name + ' on ' + EFF[big.e].label + ' brings more knowledge and judgment. ' + small.m.name + ' on ' + EFF[small.e].label + ' spends longer checking its own work. Choose ' + big.m.short + ' when the task needs expertise or nuance, and ' + small.m.short + ' when it is well defined but has many steps to verify.';
    } else {
      adv = big.m.name + ' is the stronger model and thinks at least as long, so expect a better answer at a higher cost.';
    }
  }
  return '<p>' + cl + '</p><p>' + adv + '</p>';
}
function updateCmp(){
  var c = cmpState(), p = PRESETS.paper;
  var A = {m:model(c.a.m), e:c.a.e}, B = {m:model(c.b.m), e:c.b.e};
  A.cost = taskCost(A.m, A.e, p); B.cost = taskCost(B.m, B.e, p);
  var mx = Math.max(A.cost, B.cost);
  var ca = document.getElementById('cc-a'); if(!ca) return;
  ca.textContent = money(A.cost); document.getElementById('cc-b').textContent = money(B.cost);
  document.getElementById('cb-a').style.width = (A.cost/mx*100) + '%';
  document.getElementById('cb-b').style.width = (B.cost/mx*100) + '%';
  document.getElementById('verdict').innerHTML = verdict(A, B);
}

function chCost(){
  var w = world(), u = usable();
  var rows = w.models.map(function(m){

      + '<td class="num">' + (m.price ? '$' + pnum(m.price.inP) : '–') + '</td><td class="num">' + (m.price ? '$' + pnum(m.price.outP) : '–') + '</td></tr>';
  }).join('');
  var effs = w.efforts.filter(function(k){ return k!=='none' && k!=='ultra'; });
  if(effs.indexOf(S.costEff)<0) S.costEff = 'medium';
  var pchips = Object.keys(PRESETS).map(function(k){ return '<button class="chip" type="button" data-act="preset" data-v="' + k + '" aria-pressed="' + (k===S.preset) + '">' + PRESETS[k].label + '</button>'; }).join('');
  var echips = effs.map(function(k){ return '<button class="chip" type="button" data-act="costeff" data-v="' + k + '" aria-pressed="' + (k===S.costEff) + '">' + EFF[k].label + '</button>'; }).join('');
  var hasLater = u.some(function(m){ return m.price && m.price.later; });
  var p = PRESETS[S.preset];
  var costs = u.map(function(m){ return {m:m, c: taskCost(m, S.costEff, p)}; });
  var mx = Math.max.apply(null, costs.map(function(x){ return x.c; }));
  var bars = costs.map(function(x){ return '<div class="bar-row" style="--c:' + x.m.color + '"><span class="nm">' + esc(x.m.name) + '</span><span class="bar"><i style="width:' + (x.c/mx*100).toFixed(1) + '%"></i></span><span class="bar-val">' + money(x.c) + '<small>' + money(x.c*100) + ' per 100</small></span></div>'; }).join('');
  return '<section class="ch" aria-labelledby="h-cost"><h2 id="h-cost">What it costs</h2>'
    + '<p class="lede">API list prices in US dollars per million tokens. A million tokens is about 750,000 words. Reasoning tokens bill as output, so higher effort raises the output side.</p>'
    + '<div class="tbl"><table><thead><tr><th scope="col">Model</th><th scope="col" class="num">Input</th><th scope="col" class="num">Output</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    + '<h3>Estimate one task</h3>'
    + '<div class="chips" role="group" aria-label="Task size">' + pchips + '</div>'
    + '<div class="chips" role="group" aria-label="Effort">' + echips + '</div>'
    + (hasLater ? '<label class="toggle"><input type="checkbox" data-act="later"' + (S.later?' checked':'') + '> Use prices after the intro period ends</label>' : '')
    + '<p class="fine">' + esc(p.label) + ': ' + esc(p.desc) + '.</p>'
    + '<div class="bars">' + bars + '</div>'
    + '<p class="fine" style="margin-top:14px">Effort multipliers are rough. Claude and OpenAI use Low 0.6×, High 1.3×, Extra high 2.2× and Max 3.7× the Medium cost, from one published benchmark of Opus 5.5. Gemini uses 0.6× and 1.4×, from Artificial Analysis runs of 3.8 Flash. Real tasks vary.</p>'
    + '<div class="plan"><h4>On a subscription?</h4><p>Claude Pro, ChatGPT Plus and Google AI Pro do not bill per task. Bigger models and higher effort use up your limit faster, in roughly these ratios.</p></div></section>';
}

/* ---------- shell ---------- */
function renderHeader(){
  var wb = Object.keys(W).map(function(k){ return '<button type="button" data-act="world" data-v="' + k + '" aria-pressed="' + (k===S.world) + '">' + IC[k] + W[k].label + '</button>'; }).join('');
  document.getElementById('worlds').innerHTML = wb;
  document.getElementById('chapters').innerHTML = CH.map(function(c,i){ return '<button type="button" data-act="ch" data-v="' + c.id + '"' + (c.id===S.ch?' aria-current="step"':'') + '><span class="n">' + (i+1) + '</span>' + c.label + '</button>'; }).join('');
  var fs = document.getElementById('fieldSel');
  fs.innerHTML = Object.keys(FIELDS).map(function(k){ return '<option value="' + k + '"' + (k===S.field?' selected':'') + '>' + esc(FIELDS[k].label) + '</option>'; }).join('');
  var cur = document.querySelector('[aria-current="step"]'); if(cur && cur.scrollIntoView){ try{ cur.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){} }
}
function pager(){
  var i = CH.findIndex(function(c){ return c.id===S.ch; }), h = '';
  if(i>0) h += '<button type="button" data-act="ch" data-v="' + CH[i-1].id + '">' + IC.left + 'Back</button>';
  if(i<CH.length-1) h += '<button type="button" class="next" data-act="ch" data-v="' + CH[i+1].id + '">Next: ' + CH[i+1].label + IC.right + '</button>';
  else h += '<button type="button" class="next" data-act="ch" data-v="models">Back to models' + IC.right + '</button>';
  return '<div class="pager">' + h + '</div>';
}
function renderMain(dir){
  stopJourney();
  var main = document.getElementById('main');
  main.setAttribute('data-dir', dir||'fwd');
  var fn = {models:chModels, effort:chEffort, examples:chExamples, upgrade:chUpgrade, cost:chCost}[S.ch];
  main.innerHTML = fn() + pager();
  if(S.ch==='effort') requestAnimationFrame(placeInd);
  if(S.ch==='models') requestAnimationFrame(startJourney);
  if(S.ch==='upgrade') updateCmp();
}
function render(dir){
  document.body.setAttribute('data-world', S.world);
  var tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content', world().theme);
  renderHeader(); renderMain(dir);
}
function setHash(){ var h = '#' + S.world + '-' + S.ch; if(location.hash !== h){ try{ history.replaceState(null, '', h); }catch(e){ location.hash = h; } } }
function readHash(){
  var m = /^#(claude|openai|gemini)-(models|effort|examples|upgrade|cost)$/.exec(location.hash || '');
  if(!m) return false;
  var changed = m[1]!==S.world || m[2]!==S.ch; S.world = m[1]; S.ch = m[2]; return changed;
}
function go(ch){
  var a = CH.findIndex(function(c){ return c.id===S.ch; }), b = CH.findIndex(function(c){ return c.id===ch; });
  S.ch = ch; setHash(); render(b<a?'back':'fwd');
  window.scrollTo(0,0);
}
function switchWorld(k, btn){
  if(k===S.world) return;
  var apply = function(){ S.world = k; setHash(); render('fwd'); };
  if(document.startViewTransition && !reduced){
    var r = btn.getBoundingClientRect(), x = r.left + r.width/2, y = r.top + r.height/2;
    var R = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
    var t = document.startViewTransition(apply);
    t.ready.then(function(){
      document.documentElement.animate({clipPath:['circle(0px at ' + x + 'px ' + y + 'px)','circle(' + R + 'px at ' + x + 'px ' + y + 'px)']},{duration:760,easing:'cubic-bezier(.3,.7,.2,1)',pseudoElement:'::view-transition-new(root)'});
    }).catch(function(){});
  } else { apply(); }
}
function setField(k){
  S.field = k; try{ localStorage.setItem('mg-field', k); }catch(e){}
  var fs = document.getElementById('fieldSel'); if(fs) fs.value = k;
  renderMain('fwd');
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if(a==='world'){ switchWorld(v, b); }
  else if(a==='ch'){ go(v); }
  else if(a==='jump'){ jumpTo(+b.getAttribute('data-i')); }
  else if(a==='sheet'){ openSheet(b.getAttribute('data-id')); }
  else if(a==='sheet-close'){ closeSheet(); }
  else if(a==='open'){ var li = b.closest('.stop'); var o = !li.classList.contains('open'); li.classList.toggle('open', o); b.setAttribute('aria-expanded', o); }
  else if(a==='effmodel'){ S.effModel[S.world] = v; renderMain('fwd'); }
  else if(a==='efflevel'){
    S.effLevel[S.world] = v; var st = effState();
    document.getElementById('scene').innerHTML = scene(st.lv, st.m.color);
    document.getElementById('readout').innerHTML = readout(st.m, st.lv);
    Array.prototype.forEach.call(document.querySelectorAll('#levels [role="radio"]'), function(x){ x.setAttribute('aria-checked', x.getAttribute('data-v')===st.lv); });
    placeInd();
  }
  else if(a==='field'){ setField(v); }
  else if(a==='exmode'){ S.exMode = v; renderMain('fwd'); }
  else if(a==='preset'){ S.preset = v; renderMain('fwd'); }
  else if(a==='costeff'){ S.costEff = v; renderMain('fwd'); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(t.id==='fieldSel'){ setField(t.value); return; }
  if(t.getAttribute('data-act')==='later'){ S.later = t.checked; renderMain('fwd'); return; }
  var k = t.getAttribute('data-cmp');
  if(k){ var c = cmpState(); c[k][t.getAttribute('data-k')] = t.value; renderMain('fwd'); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeSheet(); }
  var t = e.target; if(!t || t.getAttribute('role')!=='radio') return;
  if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
  var all = Array.prototype.filter.call(document.querySelectorAll('#levels [role="radio"]'), function(x){ return !x.disabled; });
  var i = all.indexOf(t); if(i<0) return;
  var n = all[(i + (e.key==='ArrowRight'?1:-1) + all.length) % all.length]; n.focus(); n.click(); e.preventDefault();
});
window.addEventListener('hashchange', function(){ if(readHash()) render('fwd'); });
window.addEventListener('resize', function(){ if(S.ch==='effort') placeInd(); setHdr(); });

document.getElementById('foot').innerHTML =
  '<p>Unofficial guide. Not made by or affiliated with Anthropic, OpenAI or Google. Model names belong to their owners.</p>'
  + '<p>Prices are API list prices in US dollars per million tokens, checked 15 Nov 2026. App plans bill differently, and these models change fast, so check a source before you rely on a number.</p>'

  + '<li>OpenAI: <a href="https://openai.com/index/introducing-gpt-6-1-sol/">Introducing GPT-6.1 Sol</a>; <a href="https://techcrunch.com/2026/09/22/openai-launches-gpt-6-sol-and-luna/">GPT-6 Sol and Luna launch</a>; <a href="https://apidog.com/blog/gpt-6-astra-api/">GPT-6 Astra API and effort levels</a>; <a href="https://www.buildmvpfast.com/blog/gpt-6-pro-parallel-agents-chatgpt-2026">ChatGPT effort settings and GPT-6 Pro</a>; <a href="https://www.cloudzero.com/blog/gpt-6-pricing/">GPT-5.6 Terra price</a></li>'
  + '<li>Gemini: <a href="https://ai.google.dev/gemini-api/docs/latest-model">Gemini 4 Argon docs</a>; <a href="https://deepmind.google/models/model-cards/gemini-4-carbon/">Gemini 4 Carbon model card</a>; <a href="https://ai.google.dev/gemini-api/docs/generate-content/whats-new-gemini-3.8">Gemini 3.8 Flash docs</a>; <a href="https://www.buildmvpfast.com/blog/gemini-4-argon-pricing-intro-rates-2026">Gemini price changes</a>; <a href="https://officechai.com/ai/gemini-4-hydrogen/">Hydrogen reports</a></li>'
  + '<li>Effort cost data: <a href="https://aiagentstore.ai/ai-models/reasoning-effort/claude-opus-5-5">Opus 5.5 at each effort level</a>; <a href="https://apidog.com/blog/gemini-3-8-flash-thinking-levels/">Gemini 3.8 Flash thinking levels</a></li>'
  + '</ul></details>';

readHash();
setHash();
render('fwd');
})();
</script>
</body>
