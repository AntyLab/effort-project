name: Bug report
description: Effort behaves incorrectly or contradicts its documentation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A good report lets a maintainer reproduce the problem without needing your provider account.

        **Never paste tokens, API keys, auth files, prompt transcripts, private code or `.env` files.** The dashboard URL is also private: the part after `#` is an access token. Remove paths and task text you would not post publicly. Effort does not store prompts or responses, but provider CLIs and your terminal history may contain them.

        Found a security problem? Do not open a public issue. Read the [security policy](https://github.com/AntyLab/effort-project/blob/main/SECURITY.md) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I removed tokens, prompt transcripts, private code and other secrets from everything below.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Effort is affected?
      options:
        - CLI recommendations (recommend, doctor, history)
        - Managed run (effort run)
        - Automatic session (effort auto)
        - OpenCode plugin
        - MCP server
        - Dashboard
        - Documentation
        - Packaging or installation
        - Something else
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or steps
      description: The exact command you ran. For the dashboard or an MCP host, list the steps instead. Redact prompts and paths you do not want to share.
      placeholder: effort recommend "Rename a local variable" --provider codex --json
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen, and where the documentation says so if it does.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Include the exit code and the error message or relevant output, with secrets and private details removed.
    validations:
      required: true
  - type: input
    id: effort-version
    attributes:
      label: Effort version
      description: The output of `effort --version`. If you run from a clone, use `node bin/effort.mjs --version` and add the commit hash.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: The output of `node --version`. Effort needs Node.js 22 or later.
      placeholder: v24.19.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Name, version and architecture.
      placeholder: Windows 11 24H2 x64, macOS 26 arm64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Agent CLI or host, and its version
      description: For example the output of `codex --version` or `claude --version`, an OpenCode version, or the MCP host app. `effort doctor` prints the Codex and Claude versions it finds. Write "no provider" if none is involved.
    validations:
      required: true
  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility
      description: Maintainers add the accessibility label when this applies.
      options:
        - label: This is a barrier for people with disabilities (keyboard use, screen readers, contrast, zoom or reflow, motion).
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Workarounds you found, how often it happens, links to related issues.
